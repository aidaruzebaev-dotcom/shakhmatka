name: Android-приложение

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Собрать APK
        working-directory: app
        run: |
          npm install
          mkdir -p www assets
          cp ../index.html ../manifest.webmanifest ../sw.js ../*.png www/
          cp ../icon-512.png assets/icon-only.png
          cp ../icon-maskable-512.png assets/icon-foreground.png
          cp ../icon-maskable-512.png assets/icon-background.png
          cp ../icon-512.png assets/splash.png
          cp ../icon-512.png assets/splash-dark.png
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0E6B62' --splashBackgroundColor '#0E6B62' || echo "иконки по умолчанию"
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../shakhmatka.apk

      - name: Выложить для скачивания
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Шахматка ${{ github.run_number }}
          make_latest: true
          body: Скачайте shakhmatka.apk на телефон Android и откройте файл, чтобы установить.
          files: shakhmatka.apk
